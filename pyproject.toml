[project]
name = "gemma-recirculation-reproduction"
version = "0.2.0"
description = "Reproducible fixed-recirculation experiments on frozen Gemma 3 1B PT and IT"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Joseph Vargas" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "click==8.3.1",
  "datasets==4.4.1",
  "huggingface-hub==1.3.0",
  "lm-eval[hf,ifeval]",
  "psutil==7.1.3",
  "torch==2.10.0",
  "transformers==5.0.0",
]

[project.urls]
Homepage = "https://vargasdevelopment.github.io/recirculation-lab/"
Repository = "https://github.com/VargasDevelopment/recirculation-lab"
Paper = "https://arxiv.org/abs/2608.17981"

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recirculation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
lm-eval = { git = "https://github.com/EleutherAI/lm-evaluation-harness.git", rev = "dd417662e5bda6a247489ec28d2ff46a45d1c42c" }

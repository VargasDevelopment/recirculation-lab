[project]
name = "gemma-recirculation-reproduction"
version = "0.1.0"
description = "Minimal reproduction of fixed recirculation on Gemma 3 1B PT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "click==8.3.1",
  "datasets==4.4.1",
  "huggingface-hub==1.3.0",
  "psutil==7.1.3",
  "torch==2.10.0",
  "transformers==5.0.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recirculation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
